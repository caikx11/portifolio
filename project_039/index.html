<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos com Gráficos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Controle de Gastos</h1>
        <div class="summary-cards">
            <div class="summary-card income">
                <h3>Receitas</h3>
                <p id="total-income">R$ 0,00</p>
            </div>
            <div class="summary-card expense">
                <h3>Despesas</h3>
                <p id="total-expense">R$ 0,00</p>
            </div>
            <div class="summary-card balance">
                <h3>Saldo</h3>
                <p id="total-balance">R$ 0,00</p>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <h2>Gastos por Categoria</h2>
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chart-container">
                <h2>Evolução Mensal</h2>
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div class="transaction-form-section">
            <h2>Nova Transação</h2>
            <form id="transaction-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="trans-type">Tipo:</label>
                        <select id="trans-type" required>
                            <option value="income">Receita</option>
                            <option value="expense">Despesa</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="trans-category">Categoria:</label>
                        <select id="trans-category" required>
                            <option value="">Selecione o tipo primeiro</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="trans-description">Descrição:</label>
                        <input type="text" id="trans-description" required placeholder="Ex: Salário, Aluguel, Mercado">
                    </div>
                    <div class="form-group">
                        <label for="trans-value">Valor (R$):</label>
                        <input type="number" id="trans-value" required min="0.01" step="0.01" placeholder="0,00">
                    </div>
                    <div class="form-group">
                        <label for="trans-date">Data:</label>
                        <input type="date" id="trans-date" required>
                    </div>
                </div>
                <button type="submit">Adicionar Transação</button>
            </form>
        </div>

        <div class="transactions-section">
            <h2>Transações Recentes</h2>
            <div class="filters">
                <select id="filter-type">
                    <option value="all">Todas</option>
                    <option value="income">Receitas</option>
                    <option value="expense">Despesas</option>
                </select>
                <select id="filter-category">
                    <option value="all">Todas as categorias</option>
                </select>
            </div>
            <div class="transactions-list" id="transactions-list">
                <!-- Transações serão carregadas aqui -->
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
