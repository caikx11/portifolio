<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolso Claro</title>
    <meta name="description" content="Controle de gastos com gráficos de categoria e evolução mensal.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="back-link" href="../index.html">← Portfólio</a>
    <div class="container">
        <header class="hero">
            <p class="eyebrow" id="month-label"></p>
            <h1>Bolso <em>Claro</em></h1>
        </header>
        <div class="summary-cards">
            <div class="summary-card income">
                <h3>Receitas</h3>
                <p id="total-income">R$ 0,00</p>
            </div>
            <div class="summary-card expense">
                <h3>Despesas</h3>
                <p id="total-expense">R$ 0,00</p>
            </div>
            <div class="summary-card balance">
                <h3>Saldo</h3>
                <p id="total-balance">R$ 0,00</p>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <h2>Gastos por Categoria</h2>
                <div class="canvas-wrap"><canvas id="pieChart" aria-label="Gastos por categoria"></canvas></div>
            </div>
            <div class="chart-container">
                <h2>Evolução Mensal</h2>
                <div class="canvas-wrap"><canvas id="barChart" aria-label="Receitas e despesas por mês"></canvas></div>
            </div>
        </div>

        <div class="transaction-form-section">
            <h2>Nova Transação</h2>
            <form id="transaction-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="trans-type">Tipo:</label>
                        <select id="trans-type" required>
                            <option value="income">Receita</option>
                            <option value="expense">Despesa</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="trans-category">Categoria:</label>
                        <select id="trans-category" required>
                            <option value="">Selecione o tipo primeiro</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="trans-description">Descrição:</label>
                        <input type="text" id="trans-description" required placeholder="Ex: Salário, Aluguel, Mercado">
                    </div>
                    <div class="form-group">
                        <label for="trans-value">Valor (R$):</label>
                        <input type="number" id="trans-value" required min="0.01" step="0.01" placeholder="0,00">
                    </div>
                    <div class="form-group">
                        <label for="trans-date">Data:</label>
                        <input type="date" id="trans-date" required>
                    </div>
                </div>
                <p class="form-error" id="form-error" role="alert" hidden></p>
                <button type="submit">Adicionar transação</button>
            </form>
        </div>

        <div class="transactions-section">
            <h2>Transações Recentes</h2>
            <div class="filters">
                <select id="filter-type">
                    <option value="all">Todas</option>
                    <option value="income">Receitas</option>
                    <option value="expense">Despesas</option>
                </select>
                <select id="filter-category">
                    <option value="all">Todas as categorias</option>
                </select>
            </div>
            <div class="transactions-list" id="transactions-list">
                <!-- Transações serão carregadas aqui -->
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/chart-shim.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
