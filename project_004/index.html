<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Calculadora Matemática</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="Calculadora matemática completa com operações básicas, cálculo científico e histórico de cálculos">
</head>
<body>
    <div class="container">
        <header>
            <h1>Calculadora Matemática</h1>
            <p class="subtitle">Calcule com precisão e potência</p>
        </header>

        <main>
            <div class="display">
                <div class="input-display" id="input-display">0</div>
                <div class="result-display" id="result-display">0</div>
            </div>

            <div class="buttons-grid">
                <button class="btn btn-clear" data-action="clear">C</button>
                <button class="btn btn-clear-all" data-action="clear-all">CE</button>
                <button class="btn btn-operator" data-action="operator" data-value="%">%</button>
                <button class="btn btn-operator" data-action="operator" data-value="÷">÷</button>

                <button class="btn btn-number" data-value="7">7</button>
                <button class="btn btn-number" data-value="8">8</button>
                <button class="btn btn-number" data-value="9">9</button>
                <button class="btn btn-operator" data-action="operator" data-value="*">×</button>

                <button class="btn btn-number" data-value="4">4</button>
                <button class="btn btn-number" data-value="5">5</button>
                <button class="btn btn-number" data-value="6">6</button>
                <button class="btn btn-operator" data-action="operator" data-value="-">-</button>

                <button class="btn btn-number" data-value="1">1</button>
                <button class="btn btn-number" data-value="2">2</button>
                <button class="btn btn-number" data-value="3">3</button>
                <button class="btn btn-operator" data-action="operator" data-value="+">+</button>

                <button class="btn btn-number" data-value="0">0</button>
                <button class="btn btn-number" data-value=".">.</button>
                <button class="btn btn-action special" data-action="action" data-value="backspace">⌫</button>
                <button class="btn btn-operator" data-action="operator" data-value="=">=</button>

                <button class="btn btn-number" data-value="(">(</button>
                <button class="btn btn-number" data-value=")">)</button>
                <button class="btn btn-operator" data-action="operator" data-value="^">^</button>
                <button class="btn btn-action special" data-action="action" data-value="sin">sin</button>

                <button class="btn btn-operator" data-action="operator" data-value="(">
                <button class="btn btn-operator" data-action="operator" data-value="tan">tan</button>
                <button class="btn btn-operator" data-action="operator" data-value=",">,
                <button class="btn btn-action special" data-action="action" data-value="deg">deg</button>
                <button class="btn btn-action special" data-action="action" data-value="fact">n!</button>

                <button class="btn btn-history" data-action="history">📜</button>
            </div>

            <div class="controls">
                <button class="btn btn-history-toggle" id="history-toggle">Histórico</button>
                <div class="mode-selector">
                    <button class="btn btn-mode active" data-mode="basic">Básica</button>
                    <button class="btn btn-mode" data-mode="scientific">Científica</button>
                </div>
            </div>

            <div class="history-panel" id="history-panel">
                <div class="history-header">
                    <h3>Histórico de Cálculos</h3>
                    <button class="btn btn-clear-history" id="clear-history">Limpar</button>
                </div>
                <div class="history-content" id="history-content">
                    <div class="history-item">Digite um cálculo para começar...</div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Caio. Calculadora Matemática</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
