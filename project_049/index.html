<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo de Controle de Biblioteca</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <a class="back-link" href="../index.html">← Portfólio</a>
    <div class="container">
        <header>
            <h1>Controle de Biblioteca Pessoal</h1>
            <p>Gerencie seus livros, empréstimos e devoluções</p>
        </header>

        <main>
            <div class="sidebar">
                <h2>Livros</h2>
                <div class="books-panel" id="books-panel">
                    <!-- Lista de livros será carregada aqui via JavaScript -->
                </div>
            </div>

            <div class="content-wrapper">
                <div class="toolbar">
                    <button id="add-book">Adicionar Livro</button>
                    <button id="refresh-books">Atualizar Lista</button>
                    <button id="export-data">Exportar Dados</button>
                    <button id="import-data">Importar Dados</button>
                    <button id="clear-all">Limpar Tudo</button>
                </div>

                <div id="main-content" class="main-content">
                    <!-- Conteúdo dinâmico será inserido aqui -->
                    <div id="dynamic-content"></div>
                </div>
            </div>

            <div class="properties-panel" id="properties-panel">
                <h2>Detalhes do Livro</h2>
                <form id="book-form">
                    <!-- Formulário será preenchido dinamicamente -->
                </form>
            </div>

            <div class="loan-panel" id="loan-panel">
                <h2>Registrar Empréstimo</h2>
                <form id="loan-form">
                    <!-- Formulário de empréstimo será preenchido dinamicamente -->
                </form>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
