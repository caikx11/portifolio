<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Dúvidas</title>
    <meta name="description" content="Comunidade de perguntas e respostas com votos, tags e ordenação.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="back-link" href="../index.html">← Portfólio</a>
    <div class="container">
        <header class="hero">
            <h1>Mural de <mark>Dúvidas</mark></h1>
            <p class="lede">Pergunte, responda e vote. Boas respostas sobem para o topo do mural.</p>
        </header>
        <div class="header-actions">
            <button id="ask-question-btn">Fazer uma Pergunta</button>
            <div class="sort-options">
                <label for="sort-by">Ordenar por:</label>
                <select id="sort-by">
                    <option value="newest">Mais Recentes</option>
                    <option value="votes">Mais Votadas</option>
                    <option value="unanswered">Sem Resposta</option>
                </select>
            </div>
        </div>

        <div class="questions-list" id="questions-list">
            <!-- Perguntas serão carregadas aqui -->
        </div>

        <!-- Modal para fazer pergunta -->
        <div class="modal" id="question-modal" style="display: none;" role="dialog" aria-modal="true" aria-label="Nova pergunta">
            <div class="modal-content">
                <button type="button" class="close-modal" aria-label="Fechar">&times;</button>
                <h2>Nova Pergunta</h2>
                <form id="question-form">
                    <div class="form-group">
                        <label for="question-title">Título:</label>
                        <input type="text" id="question-title" required placeholder="Ex: Como resolver erro 404 no React?">
                    </div>
                    <div class="form-group">
                        <label for="question-body">Descrição:</label>
                        <textarea id="question-body" required rows="6" placeholder="Descreva seu problema detalhadamente..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="question-tags">Tags (separadas por vírgula):</label>
                        <input type="text" id="question-tags" placeholder="Ex: react, javascript, erro-404">
                    </div>
                    <button type="submit">Publicar Pergunta</button>
                </form>
            </div>
        </div>

        <!-- Modal para ver pergunta e respostas -->
        <div class="modal" id="detail-modal" style="display: none;" role="dialog" aria-modal="true" aria-label="Pergunta e respostas">
            <div class="modal-content large">
                <button type="button" class="close-modal" aria-label="Fechar">&times;</button>
                <div id="question-detail">
                    <!-- Detalhes da pergunta serão carregados aqui -->
                </div>
                <div id="answers-section">
                    <h3>Respostas</h3>
                    <div id="answers-list">
                        <!-- Respostas serão carregadas aqui -->
                    </div>
                    <div class="add-answer">
                        <h4>Sua Resposta</h4>
                        <textarea id="answer-body" rows="4" placeholder="Escreva sua resposta..."></textarea>
                        <button id="submit-answer-btn">Enviar Resposta</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
