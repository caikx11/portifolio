<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Simples</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="blog-container">
        <header class="blog-header">
            <h1>Meu Blog Simples</h1>
            <p>Compartilhando conhecimento e ideias</p>
        </header>

        <main class="blog-main">
            <aside class="blog-sidebar">
                <section class="sidebar-section">
                    <h2>Categorias</h2>
                    <ul id="category-list" class="category-list">
                        <!-- Categorias serão inseridas aqui via JavaScript -->
                    </ul>
                </section>

                <section class="sidebar-section">
                    <h2>Tags Populares</h2>
                    <div id="tag-cloud" class="tag-cloud">
                        <!-- Tags serão inseridas aqui via JavaScript -->
                    </div>
                </section>
            </aside>

            <section class="blog-content">
                <div id="post-list" class="post-list">
                    <!-- Posts serão inseridos aqui via JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
