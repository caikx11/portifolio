<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo de Controle de Saúde</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <a class="back-link" href="../index.html">← Portfólio</a>
    <div class="container">
        <header>
            <h1>Controle de Saúde Pessoal</h1>
            <p>Acompanhe sua pressão arterial, glicose, medicação e outros indicadores de saúde</p>
        </header>

        <main>
            <div class="sidebar">
                <h2>Módulos</h2>
                <div class="module-panel" id="module-panel">
                    <!-- Módulos serão carregados aqui via JavaScript -->
                </div>
            </div>

            <div class="content-wrapper">
                <div class="toolbar">
                    <button id="add-entry">Nova Entrada</button>
                    <button id="view-relatorios">Ver Relatórios</button>
                    <button id="export-dados">Exportar Dados</button>
                    <button id="import-dados">Importar Dados</button>
                    <button id="clear-limpar">Limpar Dados</button>
                </div>

                <div id="main-content" class="main-content">
                    <!-- Conteúdo dinâmico será inserido aqui -->
                    <div id="dynamic-content"></div>
                </div>
            </div>

            <div class="properties-panel" id="properties-panel">
                <form id="entry-form">
                    <!-- Formulário será preenchido dinamicamente -->
                </form>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
