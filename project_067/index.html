<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encurtador de URLs · Zap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f2;--card:#fff;--ink:#14121f;--mut:#615f72;--ac:#6c3bff;--hi:#d4ff3a;--line:#dcdbe6;--r:18px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
 background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:6px}
.back{position:fixed;top:12px;left:12px;z-index:10;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px}
.back:hover{background:var(--ac)}
main{max-width:860px;margin:0 auto;padding:72px 16px 48px}
h1{font:800 clamp(34px,8vw,64px)/1 Unbounded,sans-serif;margin:0 0 10px;letter-spacing:-.03em}
h1 mark{background:var(--hi);padding:0 .12em;border-radius:8px}
.sub{color:var(--mut);margin:0 0 18px;max-width:52ch}
.mode{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:12px;background:#fff7c2;border:2px solid var(--ink);font-size:14px;font-weight:500;margin-bottom:22px}
.mode.real{background:#d9ffe4}
form{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:16px;box-shadow:6px 6px 0 var(--ink);display:grid;gap:10px;grid-template-columns:1fr 200px auto}
@media(max-width:700px){form{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
input{font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;min-width:0;color:var(--ink);background:#fff}
input:focus{border-color:var(--ac)}
button{font:600 15px Inter;border:2px solid var(--ink);border-radius:12px;padding:12px 18px;background:var(--ac);color:#fff;cursor:pointer;align-self:end;transition:transform .12s}
button:hover{transform:translateY(-2px)}
button.sm{padding:6px 12px;font-size:13px;background:#fff;color:var(--ink)}
button.sm:hover{background:var(--hi)}
.err{color:#b3173a;font-weight:500;min-height:22px;margin:10px 2px 0}
h2{font:500 15px Unbounded;margin:28px 0 12px}
.stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 16px}
.stat b{font:800 24px Unbounded;display:block}
.stat span{font-size:12px;color:var(--mut)}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
li{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:scale(.97)}}
.short{font:600 17px Unbounded;color:var(--ac);overflow-wrap:anywhere;text-decoration:none}
.orig{color:var(--mut);font-size:14px;overflow-wrap:anywhere;grid-column:1}
.clicks{grid-row:1/3;grid-column:2;text-align:center;min-width:68px}
.clicks b{font:800 26px Unbounded;display:block;line-height:1}
.clicks span{font-size:12px;color:var(--mut)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:28px;border:2px dashed var(--line);border-radius:var(--r)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="back" href="../index.html">← Portfólio</a>
<main>
  <h1>Encurte. <mark>Meça.</mark></h1>
  <p class="sub">Cole um link longo, receba um curtinho e acompanhe quantas pessoas clicaram.</p>
  <div id="mode" class="mode" role="status">Detectando API…</div>
  <form id="form" novalidate>
    <label>URL de destino<input id="url" type="url" placeholder="https://exemplo.com/um/caminho/enorme" autocomplete="off"></label>
    <label>Apelido (opcional)<input id="slug" type="text" placeholder="meu-link" maxlength="32" autocomplete="off"></label>
    <button type="submit">Encurtar</button>
  </form>
  <p class="err" id="err" role="alert"></p>
  <div class="stats"><div class="stat"><b id="nLinks">0</b><span>links</span></div><div class="stat"><b id="nClicks">0</b><span>cliques totais</span></div></div>
  <h2>Seus links</h2>
  <ul id="list" aria-live="polite"></ul>
</main>
<script>
(() => {
  const REAL = 'http://localhost:3067';
  const $ = (s) => document.querySelector(s);
  let mode = 'mock';

  // ---- mock: mesmo contrato do servidor Express ----
  const KEY = 'p067-links';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const save = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
  const AL = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => AL[b % AL.length]).join('');
  const okUrl = (u) => { try { return /^https?:$/.test(new URL(u).protocol); } catch { return false; } };
  const mockApi = {
    list: () => load(),
    create(url, slug) {
      if (!okUrl(url)) throw new Error('URL inválida (use http:// ou https://)');
      if (slug && (!/^[\w-]{3,32}$/.test(slug) || ['api', 'health'].includes(slug))) throw new Error('Slug inválido (3 a 32 letras, números, _ ou -)');
      const d = load(); if (slug && d.some((l) => l.slug === slug)) throw new Error('Esse slug já está em uso');
      let s = slug; while (!s || d.some((l) => l.slug === s)) s = rnd();
      d.unshift({ slug: s, url, createdAt: new Date().toISOString(), clicks: 0 }); save(d); return d[0];
    },
    click(slug) { const d = load(); const l = d.find((x) => x.slug === slug); if (l) { l.clicks++; save(d); } },
    remove(slug) { save(load().filter((l) => l.slug !== slug)); },
  };
  const realApi = async (path, opt) => {
    const r = await fetch(REAL + path, { ...opt, headers: { 'Content-Type': 'application/json' } });
    const b = r.status === 204 ? null : await r.json();
    if (!r.ok) throw new Error(b.error || 'Erro ' + r.status);
    return b;
  };
  const api = {
    list: () => mode === 'real' ? realApi('/api/links') : mockApi.list(),
    create: (url, slug) => mode === 'real' ? realApi('/api/links', { method: 'POST', body: JSON.stringify({ url, slug }) }) : mockApi.create(url, slug),
    remove: (s) => mode === 'real' ? realApi('/api/links/' + s, { method: 'DELETE' }) : mockApi.remove(s),
  };

  async function render() {
    const links = await api.list(); const ul = $('#list'); ul.textContent = '';
    $('#nLinks').textContent = links.length; $('#nClicks').textContent = links.reduce((a, l) => a + l.clicks, 0);
    if (!links.length) { const e = document.createElement('li'); e.className = 'empty'; e.style.display = 'block'; e.textContent = 'Nenhum link ainda. Crie o primeiro acima.'; ul.append(e); return; }
    for (const l of links) {
      const li = document.createElement('li');
      const short = mode === 'real' ? l.short : 'zap.demo/' + l.slug;
      const a = document.createElement('a'); a.className = 'short'; a.textContent = short.replace(/^https?:\/\//, '');
      if (mode === 'real') { a.href = l.short; a.target = '_blank'; a.rel = 'noopener'; } else { a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; a.onclick = () => { mockApi.click(l.slug); setTimeout(render, 150); }; }
      const o = document.createElement('div'); o.className = 'orig'; o.textContent = l.url;
      const c = document.createElement('div'); c.className = 'clicks'; c.innerHTML = '<b></b><span>cliques</span>'; c.firstChild.textContent = l.clicks;
      const acts = document.createElement('div'); acts.className = 'acts';
      const cp = Object.assign(document.createElement('button'), { className: 'sm', textContent: 'Copiar' });
      cp.onclick = async () => { try { await navigator.clipboard.writeText(short); cp.textContent = 'Copiado!'; } catch { cp.textContent = 'Copie manualmente'; } setTimeout(() => cp.textContent = 'Copiar', 1400); };
      const del = Object.assign(document.createElement('button'), { className: 'sm', textContent: 'Excluir' });
      del.setAttribute('aria-label', 'Excluir ' + short);
      del.onclick = async () => { await api.remove(l.slug); render(); };
      acts.append(cp, del);
      if (mode === 'mock') { const sim = Object.assign(document.createElement('button'), { className: 'sm', textContent: 'Simular clique' }); sim.onclick = () => { mockApi.click(l.slug); render(); }; acts.append(sim); }
      li.append(a, c, o, acts); ul.append(li);
    }
  }

  $('#form').onsubmit = async (e) => {
    e.preventDefault(); $('#err').textContent = '';
    try { await api.create($('#url').value.trim(), $('#slug').value.trim()); $('#url').value = ''; $('#slug').value = ''; $('#url').focus(); }
    catch (x) { $('#err').textContent = x.message; }
    render();
  };

  (async () => {
    try { const c = new AbortController(); setTimeout(() => c.abort(), 900);
      if ((await fetch(REAL + '/api/health', { signal: c.signal })).ok) mode = 'real'; } catch {}
    const m = $('#mode'); m.classList.toggle('real', mode === 'real');
    m.textContent = mode === 'real' ? 'Servidor real conectado: ' + REAL + ' (cliques contados pelo redirecionamento)' : 'Modo demonstração: dados simulados no navegador. Para cliques reais, rode o servidor em localhost:3067.';
    if (mode === 'mock' && !load().length) { mockApi.create('https://developer.mozilla.org/pt-BR/docs/Web/JavaScript', 'js-mdn'); }
    render();
    if (mode === 'real') { setInterval(render, 4000); window.addEventListener('focus', render); }
  })();
})();
</script>
</body>
</html>
