<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <a class="back-link" href="../index.html">← Portfólio</a>
    <header>
        <h1>Conversor de Moedas</h1>
        <p>Conversão simulada em tempo real</p>
    </header>

    <main>
        <div class="converter-container">
            <div class="input-section">
                <label for="amount">Valor:</label>
                <input type="number" id="amount" min="0" step="0.01" placeholder="Digite o valor">
                <select id="from-currency">
                    <!-- Opções serão inseridas via JavaScript -->
                </select>
            </div>

            <div class="swap-button">
                <button id="swap-currencies">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m5 15 7-7 7 7"></path>
                    </svg>
                </button>
                <p>Taxa de câmbio: <span id="exchange-rate">1 USD = 5.25 BRL</span></p>
            </div>

            <div class="output-section">
                <label for="converted-amount">Resultado:</label>
                <input type="text" id="converted-amount" readonly>
                <select id="to-currency">
                    <!-- Opções serão inseridas via JavaScript -->
                </select>
            </div>

            <div class="history-section">
                <h3>Histórico de Conversões</h3>
                <div id="history-list">
                    <!-- Histórico será inserido aqui -->
                </div>
                <button id="clear-history" class="btn-secondary">Limpar Histórico</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Conversor de Moedas. Taxas simuladas para fins educacionais.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
