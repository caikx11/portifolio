<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Investimentos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Simulador de Investimentos</h1>
        <div class="input-section">
            <h2>Parâmetros do Investimento</h2>
            <div class="form-group">
                <label for="initial-investment">Investimento Inicial (R$):</label>
                <input type="number" id="initial-investment" min="0" placeholder="Ex: 10000">
            </div>
            <div class="form-group">
                <label for="monthly-contribution">Aporte Mensal (R$):</label>
                <input type="number" id="monthly-contribution" min="0" placeholder="Ex: 500">
            </div>
            <div class="form-group">
                <label for="annual-rate">Taxa de Retorno Anual (%):</label>
                <input type="number" id="annual-rate" min="0" step="0.1" placeholder="Ex: 10.5">
            </div>
            <div class="form-group">
                <label for="years">Período (anos):</label>
                <input type="number" id="years" min="1" placeholder="Ex: 10">
            </div>
            <button id="calculate-btn">Calcular Simulação</button>
        </div>

        <div class="results-section">
            <h2>Resultados da Simulação</h2>
            <div id="summary-box" class="summary-box">
                <!-- Resumo será exibido aqui -->
            </div>
            <div id="chart-container">
                <!-- Gráfico será exibido aqui -->
                <canvas id="investmentChart" width="400" height="200"></canvas>
            </div>
            <div id="table-container">
                <!-- Tabela será exibida aqui -->
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
