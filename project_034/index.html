<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo de Controle de Hábitos Avançado</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Controle de Hábitos Avançado</h1>
        <div class="habit-form">
            <h2>Adicionar Novo Hábito</h2>
            <div class="form-group">
                <label for="habit-name">Nome do Hábito:</label>
                <input type="text" id="habit-name" placeholder="Ex: Ler 20 páginas, Fazer exercícios">
            </div>
            <div class="form-group">
                <label for="habit-category">Categoria:</label>
                <select id="habit-category">
                    <option value="saude">Saúde</option>
                    <option value="produtividade">Produtividade</option>
                    <option value="aprendizado">Aprendizado</option>
                    <option value="bem-estar">Bem-estar</option>
                    <option value="financas">Finanças</option>
                </select>
            </div>
            <div class="form-group">
                <label for="habit-goal">Meta Diária:</label>
                <input type="number" id="habit-goal" min="1" placeholder="Ex: 1 vez, 30 minutos">
            </div>
            <div class="form-group">
                <label for="habit-reward">Recompensa:</label>
                <input type="text" id="habit-reward" placeholder="Ex: Assistir episódio, Doce especial">
            </div>
            <button id="add-habit-btn">Adicionar Hábito</button>
        </div>

        <div class="habits-list">
            <h2>Meus Hábitos</h2>
            <div id="habits-container">
                <!-- Hábitos serão adicionados aqui dinamicamente -->
            </div>
        </div>

        <div class="stats">
            <h2>Estatísticas</h2>
            <div id="stats-container">
                <div class="stat-box">
                    <h3>Sequência Atual</h3>
                    <p id="current-streak">0 dias</p>
                </div>
                <div class="stat-box">
                    <h3>Melhor Sequência</h3>
                    <p id="best-streak">0 dias</p>
                </div>
                <div class="stat-box">
                    <h3>Hábitos Concluídos Hoje</h3>
                    <p id="completed-today">0</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
