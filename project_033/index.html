<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carimbo Fiscal</title>
    <meta name="description" content="Valide, formate e gere CPF e CNPJ com dígitos verificadores.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Libre+Franklin:wght@400;600;800&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="back-link" href="../index.html">← Portfólio</a>
    <main class="container">
        <header class="masthead">
            <p class="eyebrow">Repartição de Documentos · Via única</p>
            <h1>Carimbo Fiscal</h1>
            <p class="lede">Digite um CPF ou CNPJ. Formatamos enquanto você escreve e conferimos os dígitos verificadores.</p>
        </header>

        <section class="doc-card" aria-labelledby="cpf-title">
            <div class="doc-head"><h2 id="cpf-title">CPF</h2><span class="doc-meta">11 dígitos · pessoa física</span></div>
            <div class="form-group">
                <label for="cpf">Número do documento</label>
                <input type="text" id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00">
                <small id="cpf-feedback" class="feedback" aria-live="polite"></small>
            </div>
            <div id="cpf-result" class="result-box" aria-live="polite"></div>
            <div class="doc-actions">
                <button type="button" class="ghost" data-gen="cpf">Gerar CPF válido</button>
                <button type="button" class="ghost" data-copy="cpf">Copiar</button>
                <button type="button" class="ghost" data-clear="cpf">Limpar</button>
            </div>
        </section>

        <section class="doc-card" aria-labelledby="cnpj-title">
            <div class="doc-head"><h2 id="cnpj-title">CNPJ</h2><span class="doc-meta">14 dígitos · pessoa jurídica</span></div>
            <div class="form-group">
                <label for="cnpj">Número do documento</label>
                <input type="text" id="cnpj" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00">
                <small id="cnpj-feedback" class="feedback" aria-live="polite"></small>
            </div>
            <div id="cnpj-result" class="result-box" aria-live="polite"></div>
            <div class="doc-actions">
                <button type="button" class="ghost" data-gen="cnpj">Gerar CNPJ válido</button>
                <button type="button" class="ghost" data-copy="cnpj">Copiar</button>
                <button type="button" class="ghost" data-clear="cnpj">Limpar</button>
            </div>
        </section>
        <p class="footnote">Números gerados são fictícios e servem apenas para testes.</p>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
