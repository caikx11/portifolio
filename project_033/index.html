<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador e Formatar de CPF/CNPJ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Validador e Formatar de CPF/CNPJ</h1>
        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="Digite o CPF (ex: 123.456.789-09)">
            <small id="cpf-feedback" class="feedback"></small>
        </div>
        <div class="form-group">
            <label for="cnpj">CNPJ:</label>
            <input type="text" id="cnpj" placeholder="Digite o CNPJ (ex: 12.345.678/0001-95)">
            <small id="cnpj-feedback" class="feedback"></small>
        </div>
        <div class="results">
            <h2>Resultados:</h2>
            <div id="cpf-result" class="result-box"></div>
            <div id="cnpj-result" class="result-box"></div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
