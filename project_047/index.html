<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Contratos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Libre+Franklin:wght@400;600&family=Libre+Baskerville&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <a class="back-link" href="../index.html">← Portfólio</a>
    <div class="container">
        <header>
            <h1>Gerador de Contratos Personalizáveis</h1>
            <p>Crie contratos simples com cláusulas personalizáveis para diferentes necessidades</p>
        </header>

        <main>
            <div class="sidebar">
                <h2>Tipos de Contrato</h2>
                <div class="contract-types-panel" id="contract-types-panel">
                    <!-- Tipos de contrato serão carregados aqui via JavaScript -->
                </div>
            </div>

            <div class="content-wrapper">
                <div class="toolbar">
                    <button id="new-contract">Novo Contrato</button>
                    <button id="save-contract">Salvar Contrato</button>
                    <button id="load-contract">Carregar Contrato</button>
                    <button id="export-pdf">Exportar PDF</button>
                    <button id="clear-form">Limpar Formulário</button>
                </div>

                <div id="main-content" class="main-content">
                    <!-- Conteúdo dinâmico será inserido aqui -->
                    <div id="dynamic-content"></div>
                </div>
            </div>

            <div class="properties-panel" id="properties-panel">
                <form id="contract-form">
                    <!-- Formulário será preenchido dinamicamente -->
                </form>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
