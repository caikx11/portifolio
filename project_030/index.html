<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Jogo da Velha Online</h1>
            <p>Jogue contra o computador ou outro jogador</p>
        </header>

        <div class="game-controls">
            <div class="mode-selector">
                <label for="gameMode">Modo de jogo:</label>
                <select id="gameMode">
                    <option value="pvp">Dois Jogadores</option>
                    <option value="pvc">Contra o Computador</option>
                </select>
            </div>
            <div class="difficulty-selector">
                <label for="difficulty">Dificuldade:</label>
                <select id="difficulty">
                    <option value="easy">Fácil</option>
                    <option value="medium" selected>Médio</option>
                    <option value="hard">Difícil</option>
                </select>
            </div>
            <button id="resetBtn">Reiniciar Jogo</button>
            <button id="historyBtn">Histórico</button>
        </div>

        <div class="game-info">
            <div id="status">Vez do Jogador: <span id="currentPlayer">X</span></div>
            <div id="score">
                Placar: <span id="scoreX">0</span> X <span id="scoreO">0</span> Você
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Board cells will be generated by JavaScript -->
        </div>

        <div class="game-overlay" id="gameOverlay">
            <div class="game-overlay-content">
                <h2 id="overlayTitle">Fim de Jogo!</h2>
                <p id="overlayMessage"></p>
                <button id="overlayBtn">Jogar Novamente</button>
            </div>
        </div>

        <div class="history-panel" id="historyPanel">
            <div class="history-panel-header">
                <h3>Histórico de Partidas</h3>
                <button id="closeHistory">&times;</button>
            </div>
            <div class="history-content" id="historyContent">
                <!-- History will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
